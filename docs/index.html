<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Strudel function dictionary</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site">
    <div class="wrap">
      <h1><a href="#">Strudel function dictionary</a></h1>
      <p>Descriptions and examples for the functions you can call from a pattern.</p>
      <div class="tools">
        <label class="search">Filter
          <input id="q" type="search" placeholder="Filter functions" autocomplete="off">
        </label>
        <p id="count"></p>
      </div>
      <ul class="letters" id="letters"></ul>
    </div>
  </header>
  <main class="wrap" id="main"></main>
  <script src="dictionary.js"></script>
  <script src="app.js"></script>
</body>
</html>
